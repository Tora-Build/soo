[toolchain]
anchor_version = "0.30.1"

[features]
seeds = false
skip-lint = false

[programs.localnet]
sooth_amm = "SoothAMM11111111111111111111111111111111111"
sooth_market = "SoothMkt11111111111111111111111111111111111"
sooth_launchpad = "SoothLP111111111111111111111111111111111111"
sooth_adjudicator = "SoothAdj11111111111111111111111111111111111"

[programs.devnet]
sooth_amm = "SoothAMM11111111111111111111111111111111111"
sooth_market = "SoothMkt11111111111111111111111111111111111"
sooth_launchpad = "SoothLP111111111111111111111111111111111111"
sooth_adjudicator = "SoothAdj11111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Workspace-relative paths so `anchor build` finds the programs from this dir.
[workspace]
members = ["programs/sooth_amm", "programs/sooth_market", "programs/sooth_launchpad", "programs/sooth_adjudicator"]
