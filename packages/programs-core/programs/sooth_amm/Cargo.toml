[package]
name = "sooth_amm"
version = "0.0.0"
edition = "2021"
description = "Sooth Protocol AMM (LMSR) program — first production Anchor program"
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_amm"

# ── Toolchain notes ─────────────────────────────────────────────────────────
# Anchor 0.30.1 is the latest 0.30.x release at the time of writing.
#
# The spike (`_spikes/lmsr-cu/`) pinned `solana-program = 1.18` because
# platform-tools v1.51 (Solana CLI 3.0.13) ships cargo 1.84 which rejects
# dependencies declaring `edition2024`. Anchor 0.30.x's transitive graph stays
# inside that envelope (it pins solana-program ~1.18). If `cargo build-sbf`
# starts failing with edition2024 errors after a `cargo update`, mirror the
# pins documented in `_spikes/lmsr-cu/README.md` "Build status" section.
# ----------------------------------------------------------------------------

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Enable Anchor's `init_if_needed` constraint, used for the per-(user, market)
# Position PDA in `trade_positions` per architecture §4.2.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
# `sooth_market` is the source of truth for the `Market` PDA (owner program +
# layout + seeds). The `cpi` feature pulls only the no-entrypoint surface so
# we don't double-register the program entrypoint in this crate.
sooth_market = { path = "../sooth_market", features = ["cpi"] }
# Shared byte-offset constants for `Position` / `LockEntry` account-data
# layout. `sooth_market`'s transfer helpers parse these accounts raw because
# the cyclic-dep direction (sooth_market → sooth_amm) is forbidden; this crate
# is the single source of truth for the offsets they use. The compile-time
# assertions in `state/{position,lock_entry}.rs` cross-check the constants
# against the live struct's `SPACE` figures so any drift trips the build.
sooth-account-offsets = { path = "../../crates/sooth-account-offsets" }
# Shared cross-program constants (program IDs, USDC mint, ix discriminators).
# Owns the address-of-truth for `SOOTH_LAUNCHPAD_PROGRAM_ID` (used by
# `trade_positions` to bind the `protocol_config` PDA's owner + derivation
# without taking a path-dep on `sooth_launchpad`) and `USDC_MINT_DEVNET`
# (pinned on every `usdc_mint` Accounts entry). The compile-time assert in
# `lib.rs` ties this crate's `SOOTH_AMM_PROGRAM_ID` back to `crate::ID_CONST`
# so any drift between `declare_id!` and the shared constant trips the build.
sooth-protocol-types = { path = "../../crates/sooth-protocol-types" }

[dev-dependencies]
# Host-side math unit tests — no SBF, no anchor framework. The tests in
# `tests/lmsr_unit.rs` exercise the math module directly.
litesvm = "=0.2.1"
solana-sdk = "=1.18.26"
spl-token = "=4.0.0"
spl-associated-token-account = { version = "=2.3.0", features = [
  "no-entrypoint",
] }
sooth_launchpad = { path = "../sooth_launchpad", features = ["cpi"] }

[lints.rust]
# Match the style the spike uses — silent on the BPF target's unexpected cfgs.
unexpected_cfgs = { level = "allow" }
