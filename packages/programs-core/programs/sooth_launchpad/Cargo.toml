[package]
name = "sooth_launchpad"
version = "0.0.0"
edition = "2021"
description = "Sooth Protocol launchpad program — market factory, fee router, LP mint (LaunchpadEngine + FeeRouter port)"
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_launchpad"

# ── Toolchain notes ─────────────────────────────────────────────────────────
# Same Anchor 0.30.1 / solana-program 1.18.x envelope as `sooth_amm` and
# `sooth_market`. The transitive dep pins documented in
# `packages/programs-core/README.md` "Toolchain pins" already cover this crate
# — if `cargo build-sbf` reports edition2024 errors, replay the recipe.
#
# `sooth_launchpad` declares `sooth_amm` and `sooth_market` as path deps with
# `features = ["cpi"]` so the eventual `create_market` ix can CPI into both.
# Same workspace-build caveat as `sooth_amm → sooth_market`: feature unification
# at workspace level emits stub `.so` artifacts with no entrypoint. Each
# program must be built via its own `cargo build-sbf --manifest-path …`.
# ----------------------------------------------------------------------------

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1" }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
# CPI-only surfaces of the two sibling programs. `create_market` will compose
# `sooth_market::initialize_market` + `initialize_outcome_mints` +
# `initialize_market_vaults` + `sooth_amm::initialize_amm_state` into a single
# higher-level call. The `cpi` feature pulls only the no-entrypoint surface so
# we don't double-register the program entrypoint in this crate.
sooth_amm = { path = "../sooth_amm", features = ["cpi"] }
sooth_market = { path = "../sooth_market", features = ["cpi"] }
# Shared byte-offset constants for `ProtocolConfig` account-data layout.
# `sooth_amm`'s `trade_positions` parses `ProtocolConfig` raw because the
# cyclic-dep direction (sooth_amm → sooth_launchpad) is forbidden — this
# crate is the source of truth for the offsets it uses. The compile-time
# assertion in `state/protocol_config.rs` cross-checks the constants
# against the live struct's `SPACE` figure so any drift trips the build.
sooth-account-offsets = { path = "../../crates/sooth-account-offsets" }
# Shared cross-program constants — `USDC_MINT_DEVNET` for the `seed_lp` /
# `distribute_fees` / `create_market` Accounts pins. Compile-time assert in
# `lib.rs` ties `SOOTH_LAUNCHPAD_PROGRAM_ID` back to `crate::ID_CONST`.
sooth-protocol-types = { path = "../../crates/sooth-protocol-types" }

[dev-dependencies]
# Runtime CPI integration tests in `tests/cpi_create_market.rs` boot a
# LiteSVM harness (drop-in for `solana-program-test` BanksClient that
# doesn't pull a runtime server) with all four `.so` binaries pre-loaded
# and dispatch the outer `create_market` ix as a real on-chain call. See
# `sooth_market/Cargo.toml` for the LiteSVM 0.2.x version pin rationale.
litesvm = "=0.2.1"
solana-sdk = "=1.18.26"
spl-token = "=4.0.0"
spl-associated-token-account = "=2.3.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }
