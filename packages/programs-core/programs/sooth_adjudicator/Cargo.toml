[package]
name = "sooth_adjudicator"
version = "0.0.0"
edition = "2021"
description = "Sooth Protocol adjudicator framework — per-market resolution authority (AdjudicatorRegistry + IAdjudicator port)"
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_adjudicator"

# ── Toolchain notes ─────────────────────────────────────────────────────────
# Same Anchor 0.30.1 / solana-program 1.18.x envelope as the other production
# programs. The transitive dep pins documented in
# `packages/programs-core/README.md` "Toolchain pins" already cover this crate.
#
# Depends on `sooth_market` with `features = ["cpi"]` so `attest_outcome` can
# CPI into `sooth_market::settle`. Same workspace-build caveat as
# `sooth_amm → sooth_market`: feature unification at workspace level emits
# stub `.so` artifacts with no entrypoint. Each program must be built via its
# own `cargo build-sbf --manifest-path …`.
# ----------------------------------------------------------------------------

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1" }
anchor-spl = { version = "0.30.1" }
# CPI-only surface of `sooth_market` so `attest_outcome` can drive
# `settle` via CPI (the new auth path closing Codex's deferred half of C2).
sooth_market = { path = "../sooth_market", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
