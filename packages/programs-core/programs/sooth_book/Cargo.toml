[package]
name = "sooth_book"
version = "0.4.0"
edition = "2021"
description = "Sooth Solana on-chain CLOB — EVM `SoothBook.sol` direct port. See docs/spec/sooth_book.md."
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_book"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
sooth_market = { path = "../sooth_market", features = ["cpi"] }
sooth-protocol-types = { path = "../../crates/sooth-protocol-types" }

[dev-dependencies]
rand = "0.8.5"
litesvm = "=0.2.1"
solana-sdk = "=1.18.26"
spl-token = "=4.0.0"
spl-associated-token-account = { version = "=2.3.0", features = [
  "no-entrypoint",
] }
sooth_amm = { path = "../sooth_amm", features = ["cpi"] }
sooth_launchpad = { path = "../sooth_launchpad", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
