[package]
name = "sooth_book"
version = "0.0.0"
edition = "2021"
description = "SoothBook placeholder program-id reservation for the future Monaco fork"
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_book"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1" }

[lints.rust]
unexpected_cfgs = { level = "allow" }
