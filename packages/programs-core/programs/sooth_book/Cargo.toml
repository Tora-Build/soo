[package]
name = "sooth_book"
version = "0.4.0"
edition = "2021"
description = "Sooth Solana on-chain CLOB — EVM `SoothBook.sol` direct port. See docs/spec/sooth_book.md."
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_book"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
sooth-protocol-types = { path = "../../crates/sooth-protocol-types" }

[dev-dependencies]
rand = "0.8.5"

[lints.rust]
unexpected_cfgs = { level = "allow" }
