[package]
name = "sooth_book"
version = "0.15.5"
edition = "2021"
description = "Vendored orderbook source for the SoothBook fork"
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_book"
doctest = false

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
solana-program = "=1.18.26"
spl-token = "=4.0.0"
rust_decimal = "=1.32.0"
# protocol_product was vendored at W1 alongside Monaco's sportsbook layer.
# After W3's sportsbook strip the only remaining sooth_book code path that
# referenced it was removed. Dropping the dep so Cargo no longer compiles
# Monaco's mainnet declare_id! into the workspace tree.
sooth_market = { path = "../sooth_market", features = ["cpi"] }
sooth-account-offsets = { path = "../../crates/sooth-account-offsets" }
sooth-protocol-types = { path = "../../crates/sooth-protocol-types" }

[dev-dependencies]
test-case = "3.2.1"
litesvm = "=0.2.1"
solana-sdk = "=1.18.26"
spl-associated-token-account = { version = "=2.3.0", features = [
  "no-entrypoint",
] }
sooth_amm = { path = "../sooth_amm", features = ["cpi"] }
sooth_adjudicator = { path = "../sooth_adjudicator", features = ["cpi"] }
sooth_launchpad = { path = "../sooth_launchpad", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
