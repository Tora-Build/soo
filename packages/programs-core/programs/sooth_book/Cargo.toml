[package]
name = "sooth_book"
version = "0.15.5"
edition = "2021"
description = "Vendored orderbook source for the SoothBook fork"
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_book"
doctest = false

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }
solana-program = "=1.18.26"
spl-token = "=4.0.0"
rust_decimal = "=1.32.0"
protocol_product = { path = "vendor/protocol_product/programs/protocol_product", features = ["no-entrypoint"] }

[dev-dependencies]
test-case = "3.2.1"

[lints.rust]
unexpected_cfgs = { level = "allow" }
