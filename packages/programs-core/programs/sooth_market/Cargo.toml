[package]
name = "sooth_market"
version = "0.0.0"
edition = "2021"
description = "Sooth Protocol market lifecycle + custody program (TruthMarket + OrderEngine port)"
license = "Apache-2.0"
repository = "https://github.com/Tora-Build/sooth-solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "sooth_market"

# ── Toolchain notes ─────────────────────────────────────────────────────────
# Same Anchor 0.30.1 / solana-program 1.18.x envelope as `sooth_amm`. The
# transitive dep pins documented in `packages/programs-core/README.md`
# "Toolchain pins" already cover this crate — if `cargo build-sbf` reports
# edition2024 errors, replay the recipe.
# ----------------------------------------------------------------------------

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
# Shared byte-offset constants for the `Position` / `LockEntry` accounts that
# `transfer_to_lock` / `transfer_from_lock_vault` parse raw. The cyclic-dep
# direction (sooth_market → sooth_amm) is forbidden, so the offsets live in
# this dependency-free crate; `sooth_amm` carries `const _: () = assert!(...)`
# checks tying these constants back to its own `Position::SPACE` /
# `LockEntry::SPACE` so layout drift trips the build.
sooth-account-offsets = { path = "../../crates/sooth-account-offsets" }
# Shared cross-program constants. Owns the canonical bytes for
# `SOOTH_AMM_PROGRAM_ID` / `SOOTH_ADJUDICATOR_PROGRAM_ID` (parent-ix
# introspection in `instruction_introspection.rs`), `USDC_MINT_DEVNET`
# (pinned on every `usdc_mint` Accounts entry), and the four ix
# discriminators consumed by the introspection gate. Compile-time assert in
# `lib.rs` ties `SOOTH_MARKET_PROGRAM_ID` back to `crate::ID_CONST`.
sooth-protocol-types = { path = "../../crates/sooth-protocol-types" }

[dev-dependencies]
# Runtime CPI integration tests in `tests/cpi_*.rs` boot a LiteSVM harness
# (drop-in for `solana-program-test`/BanksClient that doesn't pull a runtime
# server) with all four `.so` binaries pre-loaded. LiteSVM 0.2.x pins to the
# same `solana-program ~1.18` envelope the program crates already share —
# newer LiteSVM (0.3+) jumps to solana 2.x which conflicts with Anchor 0.30.1.
# Each program must be built via its own `cargo build-sbf --manifest-path …`
# before the integration tests run; the harness asserts the .so files exist.
litesvm = "=0.2.1"
solana-sdk = "=1.18.26"
spl-token = "=4.0.0"
spl-associated-token-account = { version = "=2.3.0", features = [
  "no-entrypoint",
] }
# Pull in the sibling programs as host-side libs so the tests can build the
# outer adjudicator/launchpad ixs via the auto-generated `instruction` and
# `accounts` modules. The `cpi` feature pulls only the no-entrypoint surface
# so we don't double-register entrypoints in the test binary.
sooth_adjudicator = { path = "../sooth_adjudicator", features = ["cpi"] }
sooth_amm = { path = "../sooth_amm", features = ["cpi"] }
sooth_launchpad = { path = "../sooth_launchpad", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
