name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  js:
    name: JS workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      # `pnpm -r build` is a no-op while packages/* is empty (no recursive
      # targets resolved). Once packages exist, each is responsible for its
      # own `build` script.
      - name: Build (recursive)
        run: pnpm -r build

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo build
        run: cargo build --workspace

      # Empty workspace has zero .rs files, so fmt/clippy succeed trivially.
      # Once members are added under packages/programs-core/, these gates
      # start enforcing.
      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        # Exclude sooth_book — vendored from Monaco Protocol v0.15.5,
        # not subject to our lint discipline (will be heavily restructured
        # in W3 sportsbook strip-down anyway). Allows are for stylistic
        # lints in our own code that don't catch real bugs:
        #   doc_overindented_list_items: 4-space `key — value` alignment
        #   too_many_arguments: test helpers with 13+ args (tests are
        #     allowed to be ergonomic for the test author)
        #   result_large_err: LiteSVM's FailedTransactionMetadata is
        #     208 bytes; we don't control its layout
        run: |
          cargo clippy --workspace --exclude sooth_book --all-targets -- \
            -D warnings \
            -A clippy::doc_overindented_list_items \
            -A clippy::too_many_arguments \
            -A clippy::result_large_err
