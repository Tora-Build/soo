# Deploys the demo to Cloudflare Pages on every push to develop.
#
# The build runs the same secret-stripping env as a local release build:
# the vite config refuses to bake wallet secrets, and none are present in
# CI anyway. VITE_SOLANA_RPC_URL comes from the SOLANA_RPC_URL repo
# variable so the endpoint can change without a commit.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with "Cloudflare Pages: Edit"
# Required repository variables:
#   SOLANA_RPC_URL        — the RPC the deployed site should use
name: deploy-pages
# Manual trigger only — Actions minutes are billed, so nothing runs on
# push. Invoke from the Actions tab ("Run workflow") or:
#   gh workflow run deploy-pages --ref develop
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @sooth/sdk-solana build
      - name: Build demo
        working-directory: apps/demo
        env:
          VITE_TEST_MODE: "false"
          VITE_SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          # Public service URLs and chain config. None are secrets — they are
          # baked into the shipped bundle by design, and every one that is
          # missing silently amputates a feature (no drafter URL = the AI
          # draft button renders disabled; no resolver URL = automatic
          # markets can be created but never watched; no arena base = the
          # local-season banner).
          VITE_ARENA_API_BASE: https://soo-arena.zak-a35.workers.dev
          VITE_AI_DRAFTER_URL: https://soo-ai-drafter.zak-a35.workers.dev
          VITE_RESOLVER_URL: https://resolver.sooth.market
          VITE_USE_INDEXER: "false"
          VITE_SOOTH_CORE_ID: EwiENXxrU3PEdmzCttJp9viCR6JZaFnFs3aW9n9a3EWw
          VITE_USDC_MINT: ByF1KoXgDS4hyLmqYh28Gm9s2HoxouAA1VStuKC4hErX
          VITE_DEMO_EXTRA_MARKET_REFS: sol:EeADnXC7vto9JCzYxh98RHCZcPTi7fb3gfp2rHiqFGyA,sol:A6CkspesxURvocuXMWHZHLVUZ1sxurnsMFfdA2TSQXMH,sol:C6QwrroKHJt2MvyKSpUZCF1GwfzB1RwbnC9dN2YtAqJW,sol:B68ZZmFKAC7cE8sRYoKejFwbmiFe5CpaQMzq7qybb9X8,sol:GZHRt3CQZpFrGhxvQ5kogeUKtc5LcyM69EJ5YyoGQAop,sol:Ch7CrFj1yTnkbJfB9zLuciJFNx5nfdhyZG1PgVmLzpCo,sol:4ZiCmm5LcRqsQQiU4yY8UpNbLY6mHD61wQaDgrnYyaes,sol:8ZLH1Z74mmnegiw7VdGqscPZhA65MSX7wKeHfpoEZDLW,sol:6wujVVKwW9tUemyKoKcycVgyEk9rArZkJmWrUCkGj4rE
        run: pnpm build
      # Plain wrangler via pnpm dlx — wrangler-action installs wrangler with
      # npm inside the working directory, and npm cannot read the pnpm
      # workspace's `workspace:*` protocol, so the action dies before it
      # ever reaches Cloudflare.
      - name: Deploy to Pages
        working-directory: apps/demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a35f6796edc6a6896898c0134c935850
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=soo
