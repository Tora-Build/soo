name: E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cargo-test:
    name: Cargo tests
    runs-on: ubuntu-latest
    needs: anchor-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download .so binaries from anchor-build job
        # The workspace is one member, `sooth_core`, and its Rust tests are
        # pure unit tests. The artifact is pulled so a LiteSVM-backed Rust test
        # can load `target/deploy/*.so` without this job failing on a missing
        # target/deploy.
        uses: actions/download-artifact@v4
        with:
          name: target-deploy
          path: target/deploy/

      # `--workspace` is one crate: `sooth_core`. The book, the AMM and the
      # market lifecycle are modules inside it, not separate packages. The
      # book's compute-unit ceiling is measured against the real program by
      # `packages/sdk-solana/tests/book-cu-budget.test.ts`, which the SDK
      # Vitest job below runs; it lives there because the measurement needs
      # LiteSVM plus the TypeScript book builders.
      - name: Cargo test
        run: cargo test --workspace

  sdk-vitest:
    name: SDK Vitest
    runs-on: ubuntu-latest
    needs: anchor-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json's packageManager field
        # (pnpm@9.0.0). Specifying it twice causes ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Download .so binaries from anchor-build job
        uses: actions/download-artifact@v4
        with:
          name: target-deploy
          path: target/deploy/

      - name: Build SDK (required for apps/demo typecheck to resolve @sooth/sdk-solana)
        run: pnpm -F @sooth/sdk-solana build

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: SDK tests
        run: pnpm -F @sooth/sdk-solana test

  anchor-build:
    # Catches SBF stack-offset errors + IDL-gen regressions on every
    # PR. `cargo build-sbf` misses stack-offset cases that surface only
    # during anchor's combined build pipeline. The full e2e job ALSO does
    # anchor build but only runs on push-to-main, which would let
    # regressions land before being caught. This job is the PR-time guard.
    # No untrusted input (static commands).
    name: Anchor build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        # No --locked: anchor v0.30.1's Cargo.lock pins time=0.3.29, which
        # has a type-inference bug on rustc 1.95 (E0282 in
        # time/src/format_description/parse/mod.rs:83). Letting cargo
        # resolve transitive deps fresh picks up time=0.3.30+ which has
        # the fix. Drift risk is bounded by the --tag pin.
        run: |
          cargo install \
            --git https://github.com/coral-xyz/anchor \
            --tag v0.30.1 \
            anchor-cli

      - name: Anchor build (catches stack-offset + IDL regressions)
        working-directory: packages/programs-core
        run: anchor build

      - name: Upload .so binaries for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: target-deploy
          path: target/deploy/*.so
          retention-days: 1

  e2e:
    name: Surfpool Playwright E2E
    runs-on: ubuntu-latest
    # Run on every PR + every main push: a real Surfpool boot plus the full UI
    # suite, which catches chain-shim / hook regressions the cargo and vitest
    # gates cannot see.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json's packageManager field
        # (pnpm@9.0.0). Specifying it twice causes ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install

      - name: Install Playwright and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pnpm -F @sooth/demo exec playwright install --with-deps chromium

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        # No --locked: anchor v0.30.1's Cargo.lock pins time=0.3.29, which
        # has a type-inference bug on rustc 1.95 (E0282 in
        # time/src/format_description/parse/mod.rs:83). Letting cargo
        # resolve transitive deps fresh picks up time=0.3.30+ which has
        # the fix. Drift risk is bounded by the --tag pin.
        run: |
          cargo install \
            --git https://github.com/coral-xyz/anchor \
            --tag v0.30.1 \
            anchor-cli

      - name: Install Surfpool
        run: |
          curl -sL https://run.surfpool.run/ | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build all programs via anchor build
        # Use anchor build (not cargo build-sbf) so the full IDL-gen + SBF
        # link pipeline runs. cargo build-sbf misses stack-offset errors that
        # only surface during anchor's combined build. Auto-generates IDLs to
        # packages/programs-core/target/idl/ as a side effect;
        # dev:surfpool's pre-flight expects .so files in target/deploy.
        # No untrusted input (static command, no github.event.* subs).
        working-directory: packages/programs-core
        run: anchor build

      - name: Create local deploy payer
        run: solana-keygen new -o apps/demo/.deploy-payer.json --no-bip39-passphrase --silent

      - name: Build SDK (seed-localnet imports from packages/sdk-solana/dist)
        # apps/demo/scripts/seed-localnet.mjs dynamic-imports leaf modules
        # under packages/sdk-solana/dist/. Without this step the seed step
        # inside dev:surfpool fails with ERR_MODULE_NOT_FOUND.
        run: pnpm -F @sooth/sdk-solana build

      - name: Boot Surfpool demo
        run: |
          mkdir -p apps/demo/test-results
          pnpm -F @sooth/demo dev:surfpool > apps/demo/test-results/dev-surfpool.log 2>&1 &
          echo "$!" > /tmp/sooth-demo.pid
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:5175 >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/sooth-demo.pid)" 2>/dev/null; then
              tail -200 apps/demo/test-results/dev-surfpool.log
              exit 1
            fi
            sleep 2
          done
          tail -200 apps/demo/test-results/dev-surfpool.log
          exit 1

      - name: Run Playwright E2E
        # playwright.config.ts requires VITE_TEST_KEYPAIR_BYTES and
        # global-setup requires TEST_PUBKEY; both are only in the .env.local
        # the surfpool boot step above wrote, and neither is read from a file.
        run: |
          set -a
          . apps/demo/.env.local
          set +a
          TEST_PUBKEY="$(solana-keygen pubkey apps/demo/.localnet/user-keypair.json)" \
            E2E_VIDEO=on pnpm -F @sooth/demo test:e2e

      - name: Build walkthrough video
        run: node apps/demo/scripts/build-e2e-walkthrough.mjs

      - name: Upload walkthrough artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sooth-solana-e2e-suite-walkthrough
          path: apps/demo/test-results/e2e-suite-walkthrough.mp4
          if-no-files-found: warn

      - name: Stop Surfpool demo
        if: always()
        run: |
          if [ -f /tmp/sooth-demo.pid ]; then
            kill "$(cat /tmp/sooth-demo.pid)" 2>/dev/null || true
          fi
