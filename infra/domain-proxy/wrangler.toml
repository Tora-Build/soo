# Runs on the account that owns the sooth.market zone. Routes the demo
# subdomain to the Pages deployment on the other account — Cloudflare
# refuses a cross-account Pages custom domain, so this Worker serves the
# hostname and fetches the real site. Deployed once; site deploys on the
# Pages side never touch it.
name = "soo-domain"
main = "src/index.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "soo.sooth.market/*", zone_name = "sooth.market" }
]
